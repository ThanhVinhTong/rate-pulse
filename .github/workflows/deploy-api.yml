name: Deploy API to production

on:
  push:
    branches: [ main ]
    paths:
      - 'rate-pulse-api/**'
      - 'ovh/**'
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: vinhtongthanh57/rate-pulse-api
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build & push Docker image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest ./rate-pulse-api
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker push $IMAGE_NAME:latest

  deploy:
    name: Deploy on OVH VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6

      - name: Copy Kubernetes manifests
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          passphrase: ${{ secrets.OVH_SSH_PASSPHRASE }}
          key: ${{ secrets.OVH_SSH_KEY }}
          source: "ovh/*"
          target: "~/rate-pulse-api"

      - name: SSH → Apply Secrets & Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          passphrase: ${{ secrets.OVH_SSH_PASSPHRASE }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            set -eu
            export KUBECONFIG="$HOME/.kube/config"
            cd ~/rate-pulse-api
            
            # 1. Create/Update the Kubernetes Secret
            kubectl create secret generic rate-pulse-secrets \
              --from-literal=DB_SOURCE='${{ secrets.DB_SOURCE }}' \
              --from-literal=DB_DRIVER='${{ secrets.DB_DRIVER }}' \
              --from-literal=HTTP_SERVER_ADDRESS='${{ secrets.HTTP_SERVER_ADDRESS }}' \
              --from-literal=GRPC_SERVER_ADDRESS='${{ secrets.GRPC_SERVER_ADDRESS }}' \
              --from-literal=MONGO_URI='${{ secrets.MONGO_URI }}' \
              --from-literal=MONGO_DB='${{ secrets.MONGO_DB }}' \
              --from-literal=MONGO_COLLECTION='${{ secrets.MONGO_COLLECTION }}' \
              --from-literal=ACCESS_TOKEN_DURATION='${{ secrets.ACCESS_TOKEN_DURATION }}' \
              --from-literal=TOKEN_SYMMETRIC_KEY='${{ secrets.TOKEN_SYMMETRIC_KEY }}' \
              --from-literal=REFRESH_TOKEN_DURATION='${{ secrets.REFRESH_TOKEN_DURATION }}' \
              --from-literal=REDIS_ADDRESS='${{ secrets.REDIS_ADDRESS }}' \
              --from-literal=REDIS_USERNAME='${{ secrets.REDIS_USERNAME }}' \
              --from-literal=REDIS_PASSWORD='${{ secrets.REDIS_PASSWORD }}' \
              --from-literal=REDIS_TLS='${{ secrets.REDIS_TLS }}' \
              --from-literal=EMAIL_SMTP_HOST='${{ secrets.EMAIL_SMTP_HOST }}' \
              --from-literal=EMAIL_SMTP_PORT='${{ secrets.EMAIL_SMTP_PORT }}' \
              --from-literal=EMAIL_SMTP_USERNAME='${{ secrets.EMAIL_SMTP_USERNAME }}' \
              --from-literal=EMAIL_SMTP_PASSWORD='${{ secrets.EMAIL_SMTP_PASSWORD }}' \
              --from-literal=EMAIL_SENDER_ADDRESS='${{ secrets.EMAIL_SENDER_ADDRESS }}' \
              --from-literal=EMAIL_SENDER_NAME='${{ secrets.EMAIL_SENDER_NAME }}' \
              --from-literal=FRONTEND_VERIFY_EMAIL_URL='${{ secrets.FRONTEND_VERIFY_EMAIL_URL }}' \
              --from-literal=RATE_LIMIT_PER_MINUTE='${{ secrets.RATE_LIMIT_PER_MINUTE }}' \
              --dry-run=client -o yaml | kubectl apply -f -
            
            # 2. Docker Hub pull secret (same credentials as the build job)
            kubectl create secret docker-registry dockerhub-pull \
              --docker-server=https://index.docker.io/v1/ \
              --docker-username='${{ secrets.DOCKERHUB_USERNAME }}' \
              --docker-password='${{ secrets.DOCKERHUB_TOKEN }}' \
              --docker-email=noreply@docker.com \
              --dry-run=client -o yaml | kubectl apply -f -

            # 3. Apply deployment manifests
            kubectl apply -f ovh/deployment.yaml
            kubectl apply -f ovh/service.yaml
            kubectl apply -f ovh/issuer.yaml
            kubectl apply -f ovh/ingress.yaml
            kubectl apply -f ovh/worker-deployment.yaml
              
            # 4. Restart deployment and wait for it to be ready
            kubectl rollout restart deployment/rate-pulse-api-deployment
            kubectl rollout restart deployment/rate-pulse-worker-deployment

            kubectl rollout status deployment/rate-pulse-api-deployment --timeout=180s
            kubectl rollout status deployment/rate-pulse-worker-deployment --timeout=180s

            # 5. Delete configmap and app.env file
            kubectl delete configmap app-env --ignore-not-found=true
            rm -f ~/rate-pulse-api/app.env
